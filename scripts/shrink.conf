# shrink.conf - presets for shrink.py (auto-loaded from the same directory)
# Presets for shrink.py (loaded automatically from the same directory)
#
# Billing is per IMAGE DIMENSION, not per KB -- so the first number is a token budget.
# Billing is per IMAGE DIMENSION, not per KB, so the first number is a token budget.
#
# format:  name = tokens,quality,sharpen
#   tokens  = token budget for the output size (script shrinks the long side to fit it)
#   quality = JPEG/WEBP quality (does not change billing; lower = blurrier, no saving)
#   sharpen = 0..200 unsharp mask applied after downscale
# legacy form also accepted:  ui = max_side=820,75
#
# Calibrated on a 1080x2408 / 480dpi phone with Chinese UI text.
# Re-calibrate on your own device: docs/token-cost.md

default = ui          # daily driver; if small text is unreadable, try dense / detail

ui      = 420,90,120  # smallest size that still renders UI detail: 1080x2408 -> ~379x820, tok~414
dense   = 600,90,110  # dense small text / tables / logs: ~453x980, tok~592
detail  = 900,90,90   # pixel-peeping small text: ~570x1240, tok~890
scan    = 300,92,135  # layout positions only, small text not guaranteed
thumb   = 130,92,150  # "which screen is this": ~214x460, tok~125
max     = 1631,92,0   # upstream caps the long side at 1568; bigger pixels are not billed more

# legacy names
large   = 900,90,90
tiny    = 300,92,135
orig    = 1631,92,0
